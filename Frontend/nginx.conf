# Path asli permintaan, tanpa query dan slash akhir. Kosong = bukan halaman publik.
# Memakai $request_uri karena $uri berubah jadi /index.html setelah try_files.
map $request_uri $seo_path {
    default                    "";
    ~^/(\?|$)                  "/";
    ~^/ibadah-raya/?(\?|$)     "/ibadah-raya";
    ~^/tentang/?(\?|$)         "/tentang";
    ~^/youth/?(\?|$)           "/youth";
    ~^/life-group/?(\?|$)      "/life-group";
    ~^/kontak/?(\?|$)          "/kontak";
}

map $seo_path $seo_title {
    default        "GBI Philadelphia Life Center";
    "/"            "GBI Philadelphia Life Center — Gereja di Babarsari, Sleman, Yogyakarta";
    "/ibadah-raya" "Ibadah Raya Minggu 10.00 WIB — GBI Philadelphia Life Center Babarsari";
    "/tentang"     "Tentang Kami — GBI Philadelphia Life Center Yogyakarta";
    "/youth"       "Youth Ministry — GBI Philadelphia Life Center Babarsari";
    "/life-group"  "Life Group (Komsel) — GBI Philadelphia Life Center Yogyakarta";
    "/kontak"      "Kontak dan Lokasi — GBI Philadelphia Life Center Babarsari";
}

map $seo_path $seo_description {
    default        "GBI Philadelphia Life Center (GBI PLC) adalah gereja di Babarsari, Sleman, Yogyakarta.";
    "/"            "GBI Philadelphia Life Center (GBI PLC) adalah gereja di Babarsari, Sleman, Yogyakarta. Ibadah Raya setiap Minggu pukul 10.00 WIB, Youth, Life Group, dan materi kotbah.";
    "/ibadah-raya" "Jadwal Ibadah Raya GBI PLC di Jl. Babarsari No.45, Sleman, Yogyakarta, setiap Minggu pukul 10.00 WIB, lengkap dengan materi kotbah.";
    "/tentang"     "Kenali visi, sejarah, dan gembala GBI Philadelphia Life Center, gereja Bethel di Babarsari, Sleman, Yogyakarta.";
    "/youth"       "Komunitas anak muda GBI PLC di Babarsari, Yogyakarta: ibadah, kegiatan, dan cara bergabung.";
    "/life-group"  "Bergabung dengan Life Group GBI PLC untuk bertumbuh bersama dalam komunitas kecil di area Yogyakarta dan Sleman.";
    "/kontak"      "Alamat Jl. Babarsari No.45, Caturtunggal, Depok, Sleman, Yogyakarta 55281. Hubungi kami di +62 853-3661-8852.";
}

# Halaman tak dikenal (admin, login, URL ngawur) otomatis noindex.
map $seo_path $seo_robots {
    default "noindex, nofollow";
    ~^/     "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1";
}

# Canonical dan og:url hanya untuk halaman publik.
map $seo_path $seo_url_tags {
    default "";
    ~^/     '<link rel="canonical" href="https://philadelphialifecenter.com$seo_path" />
    <meta property="og:url" content="https://philadelphialifecenter.com$seo_path" />';
}

# Domain staging tidak boleh terindeks.
map $host $seo_host_robots {
    default   "";
    ~*devprox "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- Security headers (dokumen HTML dari location /) ----------
    # Sumber eksternal yang dipakai aplikasi: fonts.googleapis/gstatic (font),
    # media.sabda.org (audio Alkitab), YouTube & Google Maps (iframe embed).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' https://media.sabda.org; frame-src https://www.youtube.com https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Kosong untuk domain utama (header tidak dikirim); noindex untuk devprox.
    add_header X-Robots-Tag $seo_host_robots always;

    # Proxy API ke backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Sebelumnya 0 (tak terbatas). 60m cukup untuk chunk upload maksimum
        # 50MB + overhead multipart, sambil menutup potensi DoS buffering
        # body request berukuran semaunya ke nginx.
        client_max_body_size 60m;
    }

    # Proxy file upload (public/uploads)
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aset statis
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback + SEO head per halaman
    location / {
        # /tentang/ -> /tentang (301), supaya satu halaman satu URL
        rewrite ^/(.+)/$ https://$host/$1 permanent;

        try_files $uri $uri/ /index.html;

        sub_filter_once on;
        sub_filter '<!--SEO_HEAD-->' '<title>$seo_title</title>
    <meta name="description" content="$seo_description" />
    <meta name="robots" content="$seo_robots" />
    $seo_url_tags
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GBI Philadelphia Life Center" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="$seo_title" />
    <meta property="og:description" content="$seo_description" />
    <meta property="og:image" content="https://philadelphialifecenter.com/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="$seo_title" />
    <meta name="twitter:description" content="$seo_description" />';
    }
}