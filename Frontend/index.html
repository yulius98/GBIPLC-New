<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="author" content="GBI Philadelphia Life Center" />
    <meta name="theme-color" content="#17324d" />
    <!-- Tampil seperti aplikasi saat dibuka dari layar depan HP -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GBI PLC" />
    <meta name="geo.region" content="ID-YO" />
    <meta name="geo.placename" content="Yogyakarta, Sleman" />

    <!--SEO_HEAD-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Church",
        "@id": "%SITE_URL%/#church",
        "name": "GBI Philadelphia Life Center",
        "alternateName": "GBI PLC",
        "description": "Gereja Bethel Indonesia (GBI) Philadelphia Life Center di Yogyakarta yang melayani Ibadah Raya, Youth Ministry, dan Life Group.",
        "url": "%SITE_URL%/",
        "telephone": "+6285336618852",
        "image": "%OG_IMAGE%",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Jl. Babarsari No.45, Janti, Caturtunggal, Kec. Depok",
          "addressLocality": "Sleman",
          "addressRegion": "Daerah Istimewa Yogyakarta",
          "postalCode": "55281",
          "addressCountry": "ID"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "10:00",
            "closes": "12:00"
          }
        ],
        "sameAs": ["https://www.instagram.com/philadelphialifecenter/"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "%SITE_URL%/#website",
        "name": "GBI Philadelphia Life Center",
        "alternateName": "GBI PLC",
        "url": "%SITE_URL%/",
        "inLanguage": "id-ID",
        "publisher": { "@id": "%SITE_URL%/#church" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
