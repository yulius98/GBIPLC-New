services:
  db:
    image: postgres:16-alpine
    container_name: gbiplc-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-gbiplc}

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gbiplc}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: gbiplc-backend
    restart: unless-stopped

    env_file:
      - ./Backend/.env

    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-gbiplc}?schema=public

    volumes:
      - uploads_data:/app/public/uploads

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "npx prisma migrate deploy &&
             node src/index.js"

    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: gbiplc-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gbiplc-cloudflared
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  uploads_data:

