services:
  db:
    image: postgres:16-alpine
    container_name: gbiplc-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-gbiplc}
    
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gbiplc}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: gbiplc-backend
    restart: unless-stopped

    env_file:
      - ./Backend/.env

    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-gbiplc}?schema=public

    volumes:
      - ./Backend/public/uploads:/app/public/uploads

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "npx prisma migrate deploy &&
             node src/index.js"

    ports:
      # Terikat loopback: backend hanya dijangkau dari server sendiri (debug),
      # bukan internet — menutupi spoof X-Forwarded-For / rate-limit bypass.
      - "127.0.0.1:8001:8000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: gbiplc-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      # Terikat loopback: publik hanya lewat cloudflared tunnel. Jika port 80
      # terbuka ke internet, klien langsung bisa memalsukan X-Forwarded-For
      # dan melewati rate limit (CF-Connecting-IP pun tidak berlaku pada
      # request yang tidak lewat Cloudflare).
      - "127.0.0.1:80:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gbiplc-cloudflared
    restart: unless-stopped
    # Keamanan: jangan muat seluruh Backend/.env di container tunnel — itu
    # membocorkan secret DB/JWT/SMTP ke proses yang hanya butuh token tunnel.
    # Token kini wajib di .env root (lihat .env.example); ':?' membuat compose
    # menolak start bila token belum diset, bukan diam-diam memakai kosong.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN di .env root (bukan Backend/.env)}
    command: tunnel --no-autoupdate run
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  uploads_data:

